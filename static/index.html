<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Cartoon Recap Auto Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Padauk', sans-serif; }</style>
</head>
<body class="bg-[#0A0D14] text-slate-100 min-h-screen">
    <div class="max-w-4xl mx-auto px-6 py-12">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white">🎬 2.5D Cartoon Recap Auto-Post Studio</h1>
            <p class="text-xs text-indigo-400 mt-1">AI ဇာတ်ညွှန်း + TTS အသံ + 2.5D ကာတွန်း Shorts + YouTube Auto Post</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-[#121722] border border-slate-800 p-6 rounded-2xl shadow-xl">
            <!-- Form -->
            <form id="recapForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">ကာတွန်း/ဇာတ်လမ်း အကြောင်းအရာ (Topic/Story)</label>
                    <textarea id="story_topic" rows="4" required placeholder="ဥပမာ- A weak boy gets an overpowered system in a magic academy..." 
                              class="w-full bg-[#1A2233] border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">ကာတွန်း/Anime ပုံ ထည့်ပါ (Cover Image)</label>
                    <input type="file" id="cover_image" accept="image/*" required
                           class="w-full bg-[#1A2233] border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-400 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-600 file:text-white">
                </div>

                <button type="submit" id="btnSubmit" 
                        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-indigo-600/30">
                    2.5D Recap Shorts ဖန်တီးပြီး YouTube တင်မည်
                </button>
            </form>

            <!-- Preview & Status -->
            <div class="bg-[#1A2233]/40 border border-slate-800 rounded-xl p-5 flex flex-col justify-center items-center text-center min-h-[300px]">
                <div id="stateIdle" class="space-y-2">
                    <div class="text-3xl">🎨</div>
                    <p class="text-xs text-slate-400">ဇာတ်လမ်းအကျဉ်းနှင့် ပုံထည့်သွင်းပြီး စတင်ပါ</p>
                </div>

                <div id="stateProcessing" class="hidden space-y-3">
                    <div class="w-8 h-8 border-3 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p id="procMsg" class="text-xs text-indigo-400">စတင်လည်ပတ်နေပါသည်...</p>
                </div>

                <div id="stateCompleted" class="hidden flex flex-col items-center w-full">
                    <video id="resVideo" controls class="w-[180px] h-[320px] rounded-xl object-cover border border-slate-700 mb-3"></video>
                    <p id="ytStatus" class="text-xs text-emerald-400 font-semibold mb-2"></p>
                    <a id="dlLink" download="cartoon_recap.mp4" class="px-4 py-2 bg-emerald-600 rounded-lg text-xs font-bold text-white">Download Shorts</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pollTimer = null;
        document.getElementById('recapForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const topic = document.getElementById('story_topic').value;
            const img = document.getElementById('cover_image').files[0];

            const fd = new FormData();
            fd.append('story_topic', topic);
            fd.append('cover_image', img);

            document.getElementById('stateIdle').classList.add('hidden');
            document.getElementById('stateProcessing').classList.remove('hidden');
            document.getElementById('btnSubmit').disabled = true;

            const res = await fetch('/api/create-recap', { method: 'POST', body: fd });
            const data = await res.json();

            pollTimer = setInterval(async () => {
                const sRes = await fetch(`/api/task/${data.task_id}`);
                const sData = await sRes.json();
                document.getElementById('procMsg').innerText = sData.message;

                if (sData.status === 'completed') {
                    clearInterval(pollTimer);
                    document.getElementById('stateProcessing').classList.add('hidden');
                    document.getElementById('stateCompleted').classList.remove('hidden');
                    document.getElementById('resVideo').src = sData.result_url;
                    document.getElementById('dlLink').href = sData.result_url;
                    document.getElementById('ytStatus').innerText = sData.youtube_url ? `🚀 YouTube တင်ပြီး: ${sData.youtube_url}` : "ဗီဒီယို ဖန်တီးပြီးပါပြီ";
                } else if (sData.status === 'failed') {
                    clearInterval(pollTimer);
                    alert("Error: " + sData.message);
                    location.reload();
                }
            }, 3000);
        });
    </script>
</body>
</html>
